[package]
name = "agentos-gui"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["vendor/tao"]
default-members = ["."]
resolver = "2"

[lib]
name = "agentos_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agentos-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { version = "2", features = [] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

[patch.crates-io]
tao = { path = "vendor/tao" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
